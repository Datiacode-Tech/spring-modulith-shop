# AI module against OpenRouter instead of the local Ollama. Use together with dev: --spring.profiles.active=dev,cloud
# OpenRouter speaks the OpenAI API, so the OpenAI starter is enough; only the base URL changes.
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# Pinned on purpose: any id from https://openrouter.ai/models works (e.g. a ":free" one, with tighter rate limits)
spring.ai.openai.chat.model=${OPENROUTER_MODEL:mistralai/mistral-small-24b-instruct-2501}
spring.ai.openai.chat.temperature=0.3
spring.ai.openai.chat.max-tokens=200

# The OpenAI SDK has its own HTTP client and retries (spring.http.clients.* and spring.ai.retry.* do not apply).
# Defaults are 60 s and 3 retries: keep the fallback text a few seconds away instead of minutes.
spring.ai.openai.chat.timeout=15s
spring.ai.openai.chat.max-retries=1
