# Local development against docker-compose services
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5442}/${POSTGRES_DB:shop}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.kafka.bootstrap-servers=localhost:19092
shop.security.demo-password=${DEMO_PASSWORD}

# Mailpit from docker-compose (web UI on localhost:8026)
spring.mail.host=localhost
spring.mail.port=${MAILPIT_SMTP_PORT:1026}
