# Tests get the datasource from Testcontainers (@ServiceConnection)
logging.level.com.datiacode.shop=DEBUG

# No broker in most tests; ExternalizationTests re-enables it with Testcontainers
spring.modulith.events.externalization.enabled=false
shop.security.demo-password=test

# No real SMTP server or LLM in tests: port 1 is closed, so an unexpected call fails at once instead of hanging.
# Tests that need them mock EmailSender / TextWriter.
spring.mail.host=localhost
spring.mail.port=1
spring.ai.ollama.base-url=http://localhost:1
