spring.application.name=shop

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,modulith

# Executor used by @ApplicationModuleListener (@Async)
spring.task.execution.thread-name-prefix=shop-async-
spring.task.execution.pool.core-size=4

# Event Publication Registry: on startup, resubmit publications whose listener did not complete
spring.modulith.events.republish-outstanding-events-on-restart=true

# Event externalization to Kafka: Modulith serializes events to JSON bytes itself
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Trace id (set per request by TraceIdFilter, propagated to listeners) in every log line
logging.pattern.level=%5p [%X{traceId:-}]
