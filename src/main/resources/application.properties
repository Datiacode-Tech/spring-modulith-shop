spring.application.name=shop

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,modulith

# Executor used by @ApplicationModuleListener (@Async)
spring.task.execution.thread-name-prefix=shop-async-
spring.task.execution.pool.core-size=4

# Event Publication Registry: on startup, resubmit publications whose listener did not complete
spring.modulith.events.republish-outstanding-events-on-restart=true

# Event externalization to Kafka: Modulith serializes events to JSON bytes itself
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Trace id (set per request by TraceIdFilter, propagated to listeners) in every log line
logging.pattern.level=%5p [%X{traceId:-}]

# AI module (com.datiacode.shop.ai): local Ollama by default
spring.ai.ollama.base-url=http://localhost:${OLLAMA_PORT:11434}
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-predict=200
# Two providers on the classpath (Ollama, OpenAI-compatible): pick the chat model explicitly. The "cloud" profile
# switches it to OpenRouter
spring.ai.model.chat=ollama
# Only chat is used; skip the other models the starters would register
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Timeout for the model call (Spring AI uses Boot's RestClient). Cold start on CPU measured at ~11 s
spring.http.clients.read-timeout=30s
# Spring AI retries 10 times with exponential backoff by default (2 s x 5^n): with the model down, a listener would
# hang for a very long time before falling back. Retry once, then let the caller use its fixed text.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s

# Outgoing email (notification module): fail fast instead of blocking a listener thread
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
